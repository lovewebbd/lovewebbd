<!DOCTYPE html><html lang="bn"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body {
      overflow-x: hidden;
      margin: 0;
      padding: 0;
    }
    .error-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
      position: relative;
      z-index: 10;
      background: transparent;
    }
    .error-content {
      animation: fadeIn 1s ease-out forwards;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .error-code {
      font-size: 10rem;
      font-weight: 800;
      background: var(--primary-pink);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      font-family: 'Inter', sans-serif;
      /* drop-shadow removed for visibility */
      position: relative;
    }
    .error-code::after { display: none; }
    .error-title {
      font-size: 2rem;
      font-weight: 700;
      color: #ffffff;
      font-family: 'Noto Sans Bengali', sans-serif;
    }
    .error-desc {
      font-size: 1.1rem;
      color: var(--text-sub);
      max-width: 450px;
      line-height: 1.6;
    }
    .btn-home {
      background: linear-gradient(135deg, var(--primary-pink) 0%, var(--secondary-pink) 100%);
      color: var(--text-main);
      padding: 15px 35px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      transition: all 0.3s;
      font-size: 1.1rem;
      border: none;
      cursor: pointer;
      /* shadow removed */
      margin-top: 10px;
    }
    .btn-home:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 4px 10px rgba(255, 42, 109, 0.3);
    }
    .btn-home i {
      font-size: 1.2rem;
    }
    
    /* Dynamic background shapes matching theme */
    .bg-shape {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      z-index: -1;
      opacity: 0;
    }
    .shape-1 {
      width: 400px;
      height: 400px;
      background: var(--primary-pink);
      top: -100px;
      left: -100px;
    }
    .shape-2 {
      width: 350px;
      height: 350px;
      background: var(--secondary-pink);
      bottom: -100px;
      right: -100px;
    }
  </style>
  <link rel="icon" type="image/png" href="../img/favicon.png">
<title>404 - পৃষ্ঠাটি পাওয়া যায়নি | LoveWeb</title><meta name="robots" content="noindex, nofollow"></head>
<body>
  <div id="particles-js" style="position: absolute; width: 100%; height: 100%; top: 0; left: 0; z-index: 1;"></div>
  <div class="bg-shape shape-1"></div>
  <div class="bg-shape shape-2"></div>
  <div class="error-container">
    <div class="error-content">
      <div class="error-code">404</div>
      <div class="error-title">পৃষ্ঠাটি পাওয়া যায়নি</div>
      <div class="error-desc">দুঃখিত! আপনি যে পেজটি খুঁজছেন তা মুছে ফেলা হয়েছে, নাম পরিবর্তন করা হয়েছে বা সাময়িকভাবে অনুপলব্ধ।</div>
      <a href="/" class="btn-home"><i class="fa-solid fa-arrow-left"></i> মূল পেজে ফিরে যান</a>
    </div>
  </div>
  <script src="../js/theme.js"></script>
  <script src="../js/messenger.js"></script>

  <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
  <script>
    particlesJS('particles-js', {
      particles: {
        number: { value: 60, density: { enable: true, value_area: 800 } },
        color: { value: '#ff2a6d' },
        shape: { type: 'circle' },
        opacity: { value: 0.5, random: false },
        size: { value: 3, random: true },
        line_linked: { enable: true, distance: 150, color: '#ff2a6d', opacity: 0.4, width: 1 },
        move: { enable: true, speed: 2, direction: 'none', random: false, straight: false, out_mode: 'out', bounce: false }
      },
      interactivity: {
        detect_on: 'canvas',
        events: { onhover: { enable: true, mode: 'grab' }, onclick: { enable: true, mode: 'push' }, resize: true },
        modes: { grab: { distance: 140, line_linked: { opacity: 1 } }, push: { particles_nb: 4 } }
      },
      retina_detect: true
    });
  </script>

</body></html>
