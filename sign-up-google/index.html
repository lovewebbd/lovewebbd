    <style>
    .custom-google-btn {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: transparent;
        border: 1px solid var(--border-color, rgba(255, 42, 109, 0.3));
        color: var(--text-color, #fff);
        padding: 12px;
        border-radius: 8px;
        font-family: 'Hind Siliguri', sans-serif;
        font-size: 16px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-bottom: 20px;
    }
    
    .custom-google-btn:hover {
        background: rgba(255, 255, 255, 0.05);
        border-color: var(--primary-color, #ff2a6d);
    }
    
    .custom-google-btn .google-icon {
        width: 24px;
        height: 24px;
    }
    
    html[data-theme="light"] .custom-google-btn {
        color: #333;
        border-color: #ddd;
    }
    
    html[data-theme="light"] .custom-google-btn:hover {
        background: #f9f9f9;
        border-color: var(--primary-color, #ff2a6d);
    }
</style>

    <style>

<title>LoveWeb - লগইন ও সাইন আপ | উইশিং ওয়েবসাইট তৈরি করুন</title><meta name="robots" content="index, follow"><meta name="description" content="আপনার প্রিয়জনের উইশিং সাইট তৈরি করতে আজই যুক্ত হন LoveWeb-এ।"><meta name="keywords" content="LoveWeb, Wishing Website, Gift, Anniversary, Birthday, Romantic Website, Custom Wishing Website, লাভওয়েব, কাস্টম উইশিং ওয়েবসাইট, উপহার, বিবাহবার্ষিকী, জন্মদিন"><meta name="author" content="LoveWeb"><meta property="og:type" content="website"><meta property="og:url" content="https://lovewebbd.com/sign-in/"><meta property="og:title" content="LoveWeb - লগইন ও সাইন আপ | উইশিং ওয়েবসাইট তৈরি করুন"><meta property="og:description" content="আপনার প্রিয়জনের উইশিং সাইট তৈরি করতে আজই যুক্ত হন LoveWeb-এ।"><meta property="og:image" content="https://lovewebbd.netlify.app/img/logo.png"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:url" content="https://lovewebbd.com/sign-in/"><meta name="twitter:title" content="LoveWeb - লগইন ও সাইন আপ | উইশিং ওয়েবসাইট তৈরি করুন"><meta name="twitter:description" content="আপনার প্রিয়জনের উইশিং সাইট তৈরি করতে আজই যুক্ত হন LoveWeb-এ।"><meta name="twitter:image" content="https://lovewebbd.netlify.app/img/logo.png"></head>
<body>

    <!-- Corner Theme Toggle -->
    <div class="auth-theme-corner-toggle">
        <button type="button" class="top-bar-action-btn theme-toggle-btn" onclick="window.toggleLoveWebTheme()" title="থিম পরিবর্তন করুন (লাইট / ডার্ক)">
            <i class="fa-solid fa-sun"></i>
            <span class="theme-text">লাইট মোড</span>
        </button>
    </div>

    <!-- Dynamic Notification Toast -->
    <div id="notification" class="notification-toast">
        <span id="notifMessage"></span>
    </div>

    <!-- Main Card Container -->
    <div class="auth-card floating-auth-card" id="authCard">
        
        <!-- Watermark Background -->
        <img src="../img/watermark.png" alt="LoveWeb Watermark" class="watermark-bg" onerror="this.style.display='none'">

        <div class="forms-container">
            <div class="form-box" style="left: 0; width: 100%; z-index: 2; opacity: 1; padding: 40px; display: flex; flex-direction: column; justify-content: center;">
                <div class="brand-logo" style="text-align: center;">
                    <img src="../img/logo.png" alt="LoveWeb Logo" class="logo-img">
                </div>
                <h2 class="title" style="text-align: center;">অ্যাকাউন্ট সেটআপ সম্পন্ন করুন</h2>
                <p class="desc" style="text-align: center; margin-bottom: 30px;">আপনার Google অ্যাকাউন্টের সাথে যুক্ত হতে আর একটি ধাপ বাকি!</p>
                
                <form id="googleCompleteForm">
                    <div class="input-group">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                        <input type="text" id="googleFullName" placeholder="আপনার পুরো নাম" required="" disabled style="opacity: 0.7; cursor: not-allowed;">
                    </div>
                    
                    <div class="input-group-wrapper">
                        <div class="username-wrapper">
                            <div class="input-group" style="margin-bottom: 0;">
                                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                                <input type="text" id="googleUsername" placeholder="ইউজারনেম (A-z, 0-9)" required="">
                            </div>
                        </div>
                        <div id="usernameError" class="inline-error"></div>
                    </div>
                    
                    <div class="input-group">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                        <input type="email" id="googleEmail" placeholder="ইমেল অ্যাড্রেস" required="" disabled style="opacity: 0.7; cursor: not-allowed;">
                    </div>
                    
                    <div class="input-group">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                        <input type="tel" id="googlePhone" placeholder="ফোন নম্বর (01XXXXXXXXX) - ঐচ্ছিক" maxlength="11">
                    </div>
                    
                    <button type="submit" class="btn-submit" style="margin-top: 20px;">অ্যাকাউন্ট তৈরি সম্পন্ন করুন</button>
                    <div class="mobile-toggle" style="text-align: center; margin-top: 15px; font-size: 14px;"><span id="cancelGoogleSignUp" style="cursor: pointer; color: var(--primary-color);">বাতিল করুন</span></div>
                </form>
            </div>
    </div>

        <!-- Footer Links for Help and Privacy -->
    <footer class="auth-footer">

        <a href="../privacy-and-rules/index.html" class="footer-link">
