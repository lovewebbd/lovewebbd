<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>পাসওয়ার্ড রিসেট - অ্যাকাউন্ট পুনরুদ্ধার</title>
   
    <!-- Favicon Links -->
    <link rel="icon" type="image/png" sizes="32x32" href="../img/favicon.png">
    <link rel="apple-touch-icon" href="img/favicon.png">
    
    <!-- FontAwesome Vector Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- মূল CSS ফাইল -->
    <link rel="stylesheet" href="../css/style.css">

    <!-- থিম ম্যানেজার -->
    <script src="../js/theme.js"></script>

    <style>
        .input-group i.input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-sub);
            font-size: 0.95rem;
            pointer-events: none;
        }

        .auth-theme-corner-toggle {
            position: fixed;
            top: 16px;
            right: 18px;
            z-index: 999;
        }
    </style>
</head>
<body>

    <!-- থিম টগল বাটন -->
    <div class="auth-theme-corner-toggle">
        <button type="button" class="top-bar-action-btn theme-toggle-btn" onclick="window.toggleLoveWebTheme()" title="থিম পরিবর্তন করুন (লাইট / ডার্ক)">
            <i class="fa-solid fa-sun"></i>
            <span class="theme-text">লাইট মোড</span>
        </button>
    </div>

    <!-- নোটিফিকেশন টোস্ট -->
    <div id="notification" class="notification-toast">
        <span id="notif-message"></span>
    </div>

    <!-- মূল কার্ড কন্টেইনার -->
    <div class="auth-card reset-card floating-auth-card">
        
        <!-- ওয়াটারমার্ক ব্যাকগ্রাউন্ড -->
        <img src="../img/logo.png" alt="Watermark" class="watermark-bg" onerror="this.style.display='none'">

        <!-- ফর্ম সেকশন -->
        <div class="form-box reset-form-box">
            
            <!-- ব্র্যান্ড লোগো -->
            <div class="brand-logo">
                <a href="../sign-in/index.html" id="resetBrandLogoLink"><img src="../img/logo.png" alt="Logo" class="logo-img" onerror="this.src='https://via.placeholder.com/100/ff2a6d/ffffff?text=Logo'"></a>
            </div>

            <h2 class="title" style="text-align: center;">পাসওয়ার্ড রিসেট</h2>
            <p class="desc" style="text-align: center;">আপনার অ্যাকাউন্টের সাথে যুক্ত ইমেইল ঠিকানাটি দিন। আমরা একটি ভেরিফিকেশন কোড পাঠাব।</p>

            <form id="reset-request-form" style="margin-top: 15px;">
                
                <!-- ইমেইল ইনপুট (FontAwesome Icon সহ) -->
                <div class="input-group-wrapper">
                    <div class="input-group">
                        <i class="fa-solid fa-envelope input-icon"></i>
                        <input type="email" id="reset-email" placeholder="আপনার ইমেইল দিন" required autocomplete="email">
                    </div>
                    <span class="inline-error" id="email-error"></span>
                </div>

                <!-- কোড পাঠান বাটন -->
                <button type="submit" class="btn-submit" style="margin-top: 15px;">
                    কোড পাঠান <i class="fa-solid fa-paper-plane" style="margin-left: 6px; font-size: 0.85rem;"></i>
                </button>

            </form>

            <!-- ব্যাকে যাওয়ার লিঙ্ক -->
            <div style="text-align: center; margin-top: 20px;">
                <a href="../sign-in/index.html" class="footer-link" id="resetBackLink" style="font-size: 0.9rem;">
                    <i class="fa-solid fa-arrow-left"></i> সাইন-ইন পেজে ফিরে যান
                </a>
            </div>

        </div>
    </div>

    <!-- ডাইনামিক নেভিগেশন ও স্ক্রিপ্ট -->
    <script>
      function adaptResetAuthNavigation() {
        let isLoggedIn = false;
        try {
          const sessionRaw = localStorage.getItem('loveweb_session');
          if (sessionRaw) {
            const user = JSON.parse(sessionRaw);
            if (user && (user.username || user.email || user.id || user.full_name)) {
              isLoggedIn = true;
            }
          }
        } catch (e) {}

        const backLink = document.getElementById('resetBackLink');
        const logoLink = document.getElementById('resetBrandLogoLink');

        if (isLoggedIn) {
          if (backLink) {
            backLink.href = '../index.html';
            backLink.innerHTML = '<i class="fa-solid fa-house"></i> মূল পেজে ফিরে যান';
          }
          if (logoLink) {
            logoLink.href = '../index.html';
          }
        } else {
          if (backLink) {
            backLink.href = '../sign-in/index.html';
            backLink.innerHTML = '<i class="fa-solid fa-arrow-left"></i> সাইন-ইন পেজে ফিরে যান';
          }
          if (logoLink) {
            logoLink.href = '../sign-in/index.html';
          }
        }
      }
      adaptResetAuthNavigation();
      document.addEventListener('DOMContentLoaded', adaptResetAuthNavigation);
    </script>

    <!-- HTML এর একদম শেষে লিংকযুক্ত করুন -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/messenger.js"></script>

</body>
</html>
