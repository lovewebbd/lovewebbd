<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>পাসওয়ার্ড রিসেট - অ্যাকাউন্ট পুনরুদ্ধার</title>
    
    <!-- FontAwesome Vector Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- মূল CSS ফাইল -->
    <link rel="stylesheet" href="../css/style.css">

    <style>
        /* লেআউট ফিক্স ও মোবাইল স্ক্রিন অপটিমাইজেশন */
        .reset-card {
            width: 450px;
            max-width: 90%;
            height: auto;
            min-height: initial;
            padding: 35px 25px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .reset-form-box {
            width: 100%;
            padding: 0;
            overflow: visible;
        }

        .input-group i.input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-sub);
            font-size: 0.95rem;
            pointer-events: none;
        }

        @media (max-width: 768px) {
            .reset-card {
                width: 92%;
                padding: 30px 20px;
                margin: auto;
            }
        }
    </style>
</head>
<body>

    <!-- নোটিফিকেশন টোস্ট -->
    <div id="notification" class="notification-toast">
        <span id="notif-message"></span>
    </div>

    <!-- মূল কার্ড কন্টেইনার -->
    <div class="auth-card reset-card">
        
        <!-- ওয়াটারমার্ক ব্যাকগ্রাউন্ড -->
        <img src="../assets/logo.png" alt="Watermark" class="watermark-bg" onerror="this.style.display='none'">

        <!-- ফর্ম সেকশন -->
        <div class="form-box reset-form-box">
            
            <!-- ব্র্যান্ড লোগো -->
            <div class="brand-logo">
                <img src="../assets/logo.png" alt="Logo" class="logo-img" onerror="this.src='https://via.placeholder.com/100/ff2a6d/ffffff?text=Logo'">
            </div>

            <h2 class="title" style="text-align: center;">পাসওয়ার্ড রিসেট</h2>
            <p class="desc" style="text-align: center;">আপনার অ্যাকাউন্টের সাথে যুক্ত ইমেইল ঠিকানাটি দিন। আমরা একটি ভেরিফিকেশন কোড পাঠাব।</p>

            <form id="reset-request-form" style="margin-top: 15px;">
                
                <!-- ইমেইল ইনপুট (FontAwesome Icon সহ) -->
                <div class="input-group-wrapper">
                    <div class="input-group">
                        <i class="fa-solid fa-envelope input-icon"></i>
                        <input type="email" id="reset-email" placeholder="আপনার ইমেইল দিন" required autocomplete="email">
                    </div>
                    <span class="inline-error" id="email-error"></span>
                </div>

                <!-- কোড পাঠান বাটন -->
                <button type="submit" class="btn-submit" style="margin-top: 15px;">
                    কোড পাঠান <i class="fa-solid fa-paper-plane" style="margin-left: 6px; font-size: 0.85rem;"></i>
                </button>

            </form>

            <!-- ব্যাকে যাওয়ার লিঙ্ক -->
            <div style="text-align: center; margin-top: 20px;">
                <a href="../sign-in/index.html" class="footer-link" style="font-size: 0.9rem;">
                    <i class="fa-solid fa-arrow-left"></i> সাইন-ইন পেজে ফিরে যান
                </a>
            </div>

        </div>
    </div>

    <!-- লজিক ও ইন্টারঅ্যাকশন স্ক্রিপ্ট -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const emailInput = document.getElementById('reset-email');
            const resetForm = document.getElementById('reset-request-form');
            const notif = document.getElementById('notification');
            const notifMsg = document.getElementById('notif-message');

            // ১. অটো ইমেইল ফিল করার লজিক (URL Parameter বা LocalStorage থেকে)
            const urlParams = new URLSearchParams(window.location.search);
            const emailFromUrl = urlParams.get('email');
            const savedEmail = localStorage.getItem('user_login_email');

            if (emailFromUrl) {
                emailInput.value = emailFromUrl;
            } else if (savedEmail) {
                emailInput.value = savedEmail;
            }

            // টোস্ট নোটিফিকেশন দেখানোর ফাংশন
            function showToast(message, type = 'success') {
                notifMsg.textContent = message;
                notif.className = `notification-toast show ${type}`;
                setTimeout(() => {
                    notif.classList.remove('show');
                }, 3000);
            }

            // ২. ফর্ম সাবমিট ও পরবর্তী পেজে ইমেইল পাঠানোর লজিক
            resetForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const emailValue = emailInput.value.trim();

                if (!emailValue) {
                    showToast('অনুগ্রহ করে একটি বৈধ ইমেইল লিখুন', 'error');
                    return;
                }

                // ইমেইল স্টোর করা যাতে পরের পেজে পাওয়া যায়
                localStorage.setItem('reset_email_target', emailValue);

                showToast('কোড পাঠানো হচ্ছে...', 'success');

                // verification.html পেজে রিডাইরেক্ট করা এবং ইমেইল প্যারামিটার পাস করা
                setTimeout(() => {
                    window.location.href = `verification.html?email=${encodeURIComponent(emailValue)}`;
                }, 1000);
            });
        });
    </script>
</body>
</html>
