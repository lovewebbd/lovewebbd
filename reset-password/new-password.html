<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>নতুন পাসওয়ার্ড সেট করুন - LoveWeb</title>
   
    <!-- Favicon Links -->
    <link rel="icon" type="image/png" sizes="32x32" href="../img/favicon.png">
    <link rel="apple-touch-icon" href="img/favicon.png">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- External CSS -->
    <link rel="stylesheet" href="../css/style.css">

    <style>
        .reset-card {
            width: 450px;
            max-width: 90%;
            padding: 35px 25px;
        }
        .password-strength-wrap {
            margin-top: 6px;
            font-size: 0.8rem;
        }
        .strength-bar {
            height: 4px;
            width: 0%;
            background-color: #ff4d4d;
            border-radius: 2px;
            transition: all 0.3s ease;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <!-- Notification Toast -->
    <div id="notification" class="notification-toast">
        <span id="notifMessage"></span>
    </div>

    <!-- Main Card Container -->
    <div class="auth-card reset-card">

        <!-- Watermark Background -->
        <img src="../img/watermark.png" alt="Watermark" class="watermark-bg" onerror="this.style.display='none'">

        <!-- Form Box -->
        <div class="form-box reset-form-box">

            <!-- Brand Logo / Fingerprint Icon -->
            <div class="brand-logo" style="text-align: center; margin-bottom: 15px;">
                <i class="fa-solid fa-fingerprint" style="font-size: 3rem; color: #ff2a6d;"></i>
            </div>

            <h2 class="title" style="text-align: center;">নতুন পাসওয়ার্ড দিন</h2>
            <p class="desc" style="text-align: center;">আপনার অ্যাকাউন্টের জন্য একটি শক্তিশালী নতুন পাসওয়ার্ড সেট করুন।</p>

            <form id="newPasswordForm" style="margin-top: 15px;">
                
                <!-- New Password Field -->
                <div class="input-group-wrapper" style="position: relative; margin-bottom: 15px;">
                    <div class="input-group">
                        <i class="fa-solid fa-lock input-icon" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-sub);"></i>
                        <input type="password" id="newPassword" placeholder="নতুন পাসওয়ার্ড" required autocomplete="new-password">
                        <i class="fa-solid fa-eye toggle-password" id="toggleNewPassword" style="position: absolute; right: 14px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--text-sub);"></i>
                    </div>
                    <div class="password-strength-wrap">
                        <div id="strengthBar" class="strength-bar"></div>
                        <span id="strengthText" style="color: var(--text-sub);"></span>
                    </div>

                    <!-- Password Security Rules Checklist -->
                    <div class="password-rules-checklist" id="resetPasswordChecklist">
                        <div class="rule-item" id="resetRuleLength">
                            <i class="fa-solid fa-circle-xmark"></i>
                            <span>কমপক্ষে ৮ অক্ষরের দৈর্ঘ্য</span>
                        </div>
                        <div class="rule-item" id="resetRuleCase">
                            <i class="fa-solid fa-circle-xmark"></i>
                            <span>বড় ও ছোট হাতের ইংরেজি অক্ষর (A-Z ও a-z)</span>
                        </div>
                        <div class="rule-item" id="resetRuleNumber">
                            <i class="fa-solid fa-circle-xmark"></i>
                            <span>কমপক্ষে একটি সংখ্যা (0-9)</span>
                        </div>
                        <div class="rule-item" id="resetRuleSpecial">
                            <i class="fa-solid fa-circle-xmark"></i>
                            <span>কমপক্ষে একটি বিশেষ চিহ্ন (@, #, $, %, !, ইত্যাদি)</span>
                        </div>
                    </div>
                </div>

                <!-- Confirm Password Field -->
                <div class="input-group-wrapper" style="position: relative; margin-bottom: 20px;">
                    <div class="input-group">
                        <i class="fa-solid fa-shield-halved input-icon" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-sub);"></i>
                        <input type="password" id="confirmNewPassword" placeholder="পাসওয়ার্ড নিশ্চিত করুন" required autocomplete="new-password">
                        <i class="fa-solid fa-eye toggle-password" id="toggleConfirmPassword" style="position: absolute; right: 14px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--text-sub);"></i>
                    </div>
                </div>

                <button type="submit" class="btn-submit">
                    পাসওয়ার্ড পরিবর্তন করুন <i class="fa-solid fa-key" style="margin-left: 6px; font-size: 0.85rem;"></i>
                </button>
            </form>

            <div style="text-align: center; margin-top: 20px;">
                <a href="../sign-in/index.html" class="footer-link">
                    <i class="fa-solid fa-arrow-left"></i> হোমপেজে ফিরে যান
                </a>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/messenger.js"></script>
</body>
</html>
