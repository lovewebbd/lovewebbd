<!DOCTYPE html><html lang="bn"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/theme.js"></script>
  
  <style>
    /* Custom Demo CSS */
    .demo-page-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100%;
      background: var(--bg-main);
      overflow-y: auto;
    }
    
    .demo-header {
      padding: 15px 20px;
      background: var(--card-bg);
      border-bottom: 1px solid rgba(255, 42, 109, 0.2);
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(10px);
      z-index: 50;
    }
    
    .demo-header h2 {
      margin: 0;
      color: var(--text-main);
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      gap: 15px;
    }
    
    .demo-header h2 i {
      color: var(--primary-pink);
    }
    
    .categories-container {
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }
    
    .category-card {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.3s ease;
      background-size: cover;
      background-position: center;
      min-height: 160px;
      display: flex;
      align-items: flex-end;
      padding: 20px;
    }
    
    @media (max-width: 600px) {
      .categories-container {
        grid-template-columns: 1fr;
        padding: 15px;
        gap: 15px;
      }
      .category-card {
        min-height: 140px;
      }
    }

    .category-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.1) 100%);
      z-index: 1;
    }
    [data-theme="light"] .category-card::before {
      background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.1) 100%);
    }
        
    .category-card:hover {
      border-color: var(--primary-pink);
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(255, 42, 109, 0.4);
    }
        
    .category-card-content {
      position: relative;
      z-index: 2;
      width: 100%;
      text-align: left;
    }
        
    .category-card h3 {
      color: #fff;
      font-weight: 700;
      font-size: 1.3rem;
      margin: 0;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }
    .category-subtitle {
      color: rgba(255, 255, 255, 0.9);
      font-size: 0.95rem;
      font-weight: 500;
      margin-top: 4px;
    }

    .demos-list-container {
      display: none;
      flex-direction: column;
      padding: 20px;
      max-width: 1000px;
      margin: 0 auto;
      width: 100%;
    }
    
    .demos-list-header {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }
    
    .back-btn {
      background: rgba(255,255,255,0.1);
      border: none;
      color: var(--text-main);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      transition: 0.3s;
    }
    
    .back-btn:hover {
      background: var(--primary-pink);
      color: #fff;
    }

    .demos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 15px;
    }
    
    @media (max-width: 600px) {
      .demos-grid {
        grid-template-columns: 1fr;
      }
    }
    
    .demo-item {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      cursor: pointer;
      transition: 0.3s;
      display: flex;
      align-items: center;
      gap: 15px;
    }
    
    .demo-item:hover {
      border-color: var(--primary-pink);
      background: rgba(255, 42, 109, 0.05);
      transform: translateY(-3px);
      box-shadow: 0 5px 15px rgba(255, 42, 109, 0.15);
    }
    
    .demo-item-icon {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(255, 42, 109, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    
    .demo-item-details {
      flex: 1;
      text-align: left;
    }

    .demo-item-details h4 {
      margin: 0 0 5px 0;
      color: var(--text-main);
      font-size: 1.1rem;
    }
    
    .view-btn {
      font-size: 0.85rem;
      color: #fff;
      background: var(--primary-pink);
      padding: 6px 12px;
      border-radius: 20px;
      display: inline-block;
      font-weight: 500;
    }

    #loadingOverlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      z-index: 2000;
    }
  </style>
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon.png">
  <link rel="apple-touch-icon" href="/img/favicon.png">
<title>LoveWeb - ডেমো গ্যালারি | রোমান্টিক উইশিং সাইট</title><meta name="robots" content="index, follow"><meta name="description" content="LoveWeb-এর আকর্ষণীয় ও রোমান্টিক উইশিং ওয়েবসাইটের ডেমো গ্যালারি দেখুন।"><meta name="keywords" content="LoveWeb, Wishing Website, Gift, Anniversary, Birthday, Romantic Website, Custom Wishing Website, লাভওয়েব, কাস্টম উইশিং ওয়েবসাইট, উপহার, বিবাহবার্ষিকী, জন্মদিন"><meta name="author" content="LoveWeb"><meta property="og:type" content="website"><meta property="og:url" content="https://lovewebbd.com/demos/"><meta property="og:title" content="LoveWeb - ডেমো গ্যালারি | রোমান্টিক উইশিং সাইট"><meta property="og:description" content="LoveWeb-এর আকর্ষণীয় ও রোমান্টিক উইশিং ওয়েবসাইটের ডেমো গ্যালারি দেখুন।"><meta property="og:image" content="https://lovewebbd.netlify.app/img/logo.png"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:url" content="https://lovewebbd.com/demos/"><meta name="twitter:title" content="LoveWeb - ডেমো গ্যালারি | রোমান্টিক উইশিং সাইট"><meta name="twitter:description" content="LoveWeb-এর আকর্ষণীয় ও রোমান্টিক উইশিং ওয়েবসাইটের ডেমো গ্যালারি দেখুন।"><meta name="twitter:image" content="https://lovewebbd.netlify.app/img/logo.png"></head>
<body>

  <div class="demo-page-container" id="mainContainer">

  <div style="padding-top: 10px; padding-bottom: 10px; text-align: center; width: 100%;">
    <h1 style="color: var(--text-main); font-size: 1.8rem; margin: 0;"><i class="fa-solid fa-wand-magic-sparkles" style="color: var(--primary-pink);"></i> ডেমো গ্যালারি</h1>
  </div>

    
    
    <!-- Category View -->
    <div class="categories-container" id="categoriesView">
      <div class="category-card" style="background-image: url('https://images.unsplash.com/photo-1464349153735-7db50ed83c84?auto=format&amp;fit=crop&amp;w=500&amp;q=80');" onclick="openCategory('Birthday')">
        <div class="category-card-content">
          <h3>জন্মদিনের শুভেচ্ছা</h3>
          <div class="category-subtitle">Birthday Wish</div>
        </div>
      </div>
      <div class="category-card" style="background-image: url('https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&amp;fit=crop&amp;w=500&amp;q=80');" onclick="openCategory('Anniversary')">
        <div class="category-card-content">
          <h3>সম্পর্কের বর্ষপূর্তি</h3>
          <div class="category-subtitle">Anniversary</div>
        </div>
      </div>
      <div class="category-card" style="background-image: url('https://images.unsplash.com/photo-1511285560929-80b456fea0bc?auto=format&amp;fit=crop&amp;w=500&amp;q=80');" onclick="openCategory('Relationship')">
        <div class="category-card-content">
          <h3>বিবাহবার্ষিকী</h3>
          <div class="category-subtitle">Relationship</div>
        </div>
      </div>
      <div class="category-card" style="background-image: url('https://images.unsplash.com/photo-1511895426328-dc8714191300?auto=format&amp;fit=crop&amp;w=500&amp;q=80');" onclick="openCategory('Friendship')">
        <div class="category-card-content">
          <h3>বন্ধুত্বের উদযাপন</h3>
          <div class="category-subtitle">Friendship Wish</div>
        </div>
      </div>
      <div class="category-card" style="background-image: url('https://images.unsplash.com/photo-1492684223066-81342ee5ff30?auto=format&amp;fit=crop&amp;w=500&amp;q=80');" onclick="openCategory('Others')">
        <div class="category-card-content">
          <h3>অন্যান্য স্পেশাল দিন</h3>
          <div class="category-subtitle">Others</div>
        </div>
      </div>
    </div>
    
    <!-- Demos List View -->
    <div class="demos-list-container" id="demosListView">
      <div class="demos-list-header">
        <button class="back-btn" onclick="backToCategories()"><i class="fa-solid fa-arrow-left"></i></button>
        <h2 style="color: var(--text-main); margin: 0;" id="categoryTitle">Category Name</h2>
      </div>
      <div class="demos-grid" id="demosGrid">
        <!-- Demos will be rendered here -->
      </div>
    </div>
  </div>

  <script src="../js/official-nav.js"></script>
  
  <script>
    let allDemos = [];
    
    async function loadDemos() {
      try {
        const res = await fetch('/api/demos');
        const data = await res.json();
        if (data.success) {
          allDemos = data.demos || [];
        }
      } catch (err) {
        console.error("Failed to load demos:", err);
      }
    }
    
    function openCategory(catName) {
      document.getElementById('categoriesView').style.display = 'none';
      document.getElementById('demosListView').style.display = 'flex';
      document.getElementById('categoryTitle').innerText = catName + ' Demos';
      
      const grid = document.getElementById('demosGrid');
      grid.innerHTML = '';
      
      // Filter demos based on category if they have it, otherwise just do basic keyword matching or fallback
      let filtered = allDemos.filter(d => (d.category && d.category === catName));
      
      // Fallback: if no category match, try keyword in name
      if (filtered.length === 0) {
         filtered = allDemos.filter(d => d.name.toLowerCase().includes(catName.toLowerCase()));
      }
      // If still empty and "Others", show everything else
      if (filtered.length === 0 && catName === 'Others') {
         filtered = allDemos.filter(d => !d.category || !['Birthday', 'Anniversary', 'Relationship', 'Friendship'].includes(d.category));
      }

      if (filtered.length === 0) {
        grid.innerHTML = '<p style="color: var(--text-muted); grid-column: 1/-1; text-align: center;">No demos found in this category.</p>';
      } else {
        filtered.forEach(demo => {
          let imgSrc = '';
          if(demo.category === 'Birthday' || catName === 'Birthday') {
            imgSrc = 'https://raw.githubusercontent.com/Tarikul-Islam-Anik/Animated-Fluent-Emojis/master/Emojis/Food/Birthday%20Cake.png';
          } else if(demo.category === 'Anniversary' || catName === 'Anniversary') {
            imgSrc = 'https://raw.githubusercontent.com/Tarikul-Islam-Anik/Animated-Fluent-Emojis/master/Emojis/Objects/Ring.png';
          } else if(demo.category === 'Relationship' || catName === 'Relationship') {
            imgSrc = 'https://raw.githubusercontent.com/Tarikul-Islam-Anik/Animated-Fluent-Emojis/master/Emojis/Smilies/Smiling%20Face%20with%20Hearts.png';
          } else if(demo.category === 'Friendship' || catName === 'Friendship') {
            imgSrc = 'https://raw.githubusercontent.com/Tarikul-Islam-Anik/Animated-Fluent-Emojis/master/Emojis/Hand%20gestures/Handshake.png';
          } else {
            imgSrc = 'https://raw.githubusercontent.com/Tarikul-Islam-Anik/Animated-Fluent-Emojis/master/Emojis/Travel%20and%20places/Star.png';
          }

          grid.innerHTML += `
            <div class="demo-item" onclick="openDemo('${demo.id}')">
              <div class="demo-item-icon">
                <img src="${imgSrc}" width="30" height="30" style="filter: drop-shadow(0 2px 5px rgba(0,0,0,0.2));">
              </div>
              <div class="demo-item-details">
                <h4>${demo.name}</h4>
                <span class="view-btn"><i class="fa-solid fa-eye"></i> View Demo</span>
              </div>
            </div>
          `;
        });
      }
    }
    
    function backToCategories() {
      document.getElementById('demosListView').style.display = 'none';
      document.getElementById('categoriesView').style.display = 'grid';
    }
    
    function openDemo(id) {
      const demo = allDemos.find(d => d.id === id);
      document.getElementById('demoModalTitle').innerText = demo ? demo.name : 'Demo View';
      document.getElementById('demoIframe').src = '/api/demo/view/' + id;
      document.getElementById('demoModal').style.display = 'flex';
    }

    function closeDemoModal() {
      document.getElementById('demoModal').style.display = 'none';
      document.getElementById('demoIframe').src = '';
    }
    
    window.addEventListener('DOMContentLoaded', loadDemos);
  </script>

  <!-- Demo Iframe Modal -->
  <div id="demoModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#181d28; z-index:9999999; flex-direction:column;">
    <div style="background: #181d28; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,42,109,0.3);">
      <h3 id="demoModalTitle" style="color: #fff; margin: 0; font-family: 'Hind Siliguri', sans-serif;">Demo View</h3>
      <button onclick="closeDemoModal()" style="background: #ff2a6d; color: #fff; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: 8px;">
        <i class="fa-solid fa-xmark"></i> বন্ধ করুন
      </button>
    </div>
    <iframe id="demoIframe" style="flex:1; width:100%; border:none; background:#fff;" sandbox="allow-scripts allow-same-origin"></iframe>
  </div>



</body></html>
